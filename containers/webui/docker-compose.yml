name: ai-stack

services:
  portainer:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/webui/data:/data
    environment:
      # Points at the ollama-stack container over the edge network now,
      # not host.docker.internal — see containers/ollama/CONTEXT.md.
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATA_DIR=/data
    env_file:
      - ./webui.env
    networks:
      - webui_net
      - edge

networks:
  webui_net:
    driver: bridge
  edge:
    external: true
