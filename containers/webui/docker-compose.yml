name: ai-stack

services:
  portainer:
    image: ghcr.io/open-webui/open-webui:main
    container_name: webui
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/webui/data:/data
    environment:
      # Points at the ollama-stack container over the edge network now,
      # not host.docker.internal — see containers/ollama/CONTEXT.md.
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATA_DIR=/data
      # Web search via the self-hosted searxng-stack, reached unauthenticated
      # over `edge` (same trust model as ollama) — see containers/searxng/CONTEXT.md.
      # These env vars only unlock the capability backend-side. Each model
      # still needs "Web Search" checked under its own Default Features
      # (Workspace > Models > Edit > <model>), or toggled per-message via
      # the `+` button in the chat box — otherwise native tool-calling
      # models never get `search_web` injected into their toolset at all.
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    env_file:
      - ./webui.env
    networks:
      - webui_net
      - edge

networks:
  webui_net:
    driver: bridge
  edge:
    external: true
