name: watchtower-stack
# Monitor-only: reports available image updates, never applies them.
# Auto-updating containers (especially pinned DBs like immich/atuin/postgres)
# without a human reviewing migration notes first is the kind of thing that
# takes down a homelab silently. See CONTEXT.md.

services:
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    restart: unless-stopped
    env_file:
      - ./watchtower.env
    environment:
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_SCHEDULE: "0 0 8 * * *" # daily 08:00
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_LABEL_ENABLE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
