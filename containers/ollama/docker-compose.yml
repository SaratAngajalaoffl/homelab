name: ollama-stack
# Runs as the image's default root user — the official ollama/ollama image
# has no USER directive, and /root/.ollama needs to be writable by whatever
# pulls models. Bind-mounted model data was copied in from the old host
# install (owned root:root); don't add `user:` here.

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # Ollama auto-sizes context from available VRAM, and picks a
      # conservative default (4096) for models that don't fully fit —
      # qwen3.6:35b (23GB Q4 on a 12GB GPU) lands there. That's too small
      # for this model's own reasoning: it burns thousands of tokens on
      # "thinking" before the actual answer, so at 4096 the prompt +
      # thinking exhausts the window before any final content comes out
      # (silent empty response in webui, "truncating input prompt" in
      # these logs). Override explicitly — costs more CPU-side RAM for
      # KV cache, not VRAM, since the model already spills to CPU.
      - OLLAMA_CONTEXT_LENGTH=32768
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/ollama/data:/root/.ollama
    # CDI device request, not the older `deploy.resources.reservations.devices`
    # block — this host's docker (29.x) resolves `--gpus`/legacy device
    # reservations through a broken multi-vendor CDI probe ("AMD CDI spec
    # not found") even though only an nvidia CDI spec exists. The explicit
    # `nvidia.com/gpu=all` string is the form that actually works; requires
    # `nvidia-container-toolkit` installed and `nvidia-ctk cdi generate`
    # having been run once on the host (see .setup).
    devices:
      - "nvidia.com/gpu=all"
    # No `ports:` — reachable at ollama:11434 from any other edge container
    # (webui, etc.) with no auth, same trust model as every other stack.
    # Public access goes through nginx-proxy-manager, which enforces an API
    # key via a custom Advanced-tab nginx snippet on the proxy host (ollama
    # itself has no auth of its own). See CONTEXT.md + .setup.
    networks:
      - edge

networks:
  edge:
    external: true
