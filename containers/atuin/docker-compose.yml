name: atuin-stack
# postgres defines its own user; do not override `user:` on the db service.
# The atuin server image runs fine as its default user for a fresh ./config
# bind mount — if you hit permission errors on first run, chown the host
# dir to match the container's uid rather than adding `user:` here.

services:
  atuin:
    container_name: atuin_server
    image: ghcr.io/atuinsh/atuin:18.19.0
    # entrypoint is the atuin-server binary; its own subcommand is `start`,
    # not `server start` (that longer form is for the general atuin CLI).
    command: start
    restart: unless-stopped
    env_file:
      - ./atuin.env
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_PORT: "8888"
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/atuin/config:/config
    depends_on:
      - atuin-db
    networks:
      - atuin_net
      - edge

  atuin-db:
    container_name: atuin_postgres
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./atuin.env
    # postgres:18 stores data in a version-specific subdir under
    # /var/lib/postgresql (PGDATA defaults to /var/lib/postgresql/18/docker);
    # mount the parent, not .../data like older postgres majors.
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/atuin/db:/var/lib/postgresql
    networks:
      - atuin_net

networks:
  atuin_net:
    driver: bridge
  edge:
    external: true
