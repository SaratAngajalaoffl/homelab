name: portainer-stack

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/storage/homelab/homelab-conf/portainer/data:/data
    environment:
      - TZ=UTC
    networks:
      - portainer_net
      - edge

networks:
  portainer_net:
    driver: bridge
  edge:
    external: true
