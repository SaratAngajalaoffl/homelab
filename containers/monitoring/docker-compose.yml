name: monitoring-stack
# Bind mounts under $HOME are usually uid:gid 1000:1000; adjust `user` if `id -u` / `id -g` differ.
# Promtail stays root so it can read /var/run/docker.sock without extra group mapping.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${HOME}/storage/homelab/homelab-conf/monitoring/prometheus:/prometheus
    ports:
      - 31909:9090/tcp
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    # Image defaults to uid/gid 472; a bind mount under $HOME is usually 1000:1000.
    user: "1000:1000"
    env_file:
      - ./monitoring.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/monitoring/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
      - edge
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    user: "1000:1000"
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${HOME}/storage/homelab/homelab-conf/monitoring/loki:/loki
    ports:
      - 31103:3100/tcp
    networks:
      - monitoring_net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    # Default image user is root (needed for Docker socket). Positions dir is root-writable on the bind mount.
    environment:
      TZ: UTC
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/storage/homelab/homelab-conf/monitoring/promtail:/promtail
    networks:
      - monitoring_net
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    environment:
      TZ: UTC
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    environment:
      TZ: UTC
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring_net

networks:
  monitoring_net:
    driver: bridge
  edge:
    external: true
