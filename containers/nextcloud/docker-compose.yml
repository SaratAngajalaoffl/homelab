name: nextcloud-stack
# Official image runs as www-data (uid 33); do not set `user:` here or bind mounts under $HOME break.
# Fix ownership with: docker exec -u root nextcloud chown -R www-data:www-data /var/www/html
# or store data on volumes owned by the container UIDs — see Nextcloud Docker docs.

services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "31404:80"
    env_file:
      - ./nextcloud.env
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/nextcloud/app:/var/www/html
      - ${HOME}/storage/homelab/homelab-data/nextcloud/data:/var/www/html/data
    networks:
      - nextcloud_net
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

networks:
  nextcloud_net:
    driver: bridge
