# Official image runs as its own built-in `searxng` user (uid/gid 977),
# not host uid 1000 — do not override `user:` here, it needs to write
# runtime files (secret key sed, uwsgi socket) under that identity.
name: searxng-stack

services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/searxng/config:/etc/searxng
    environment:
      # Used by searxng itself for absolute link generation, not for auth.
      - SEARXNG_BASE_URL=https://websearch.smugiwara.com/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No `ports:` — internal callers (webui, openclaw-gateway, hermes-gateway)
    # reach it unauthenticated at searxng:8080 over `edge`, same trust model
    # as ollama:11434. Public access goes through NPM at websearch.smugiwara.com,
    # gated by an NPM Access List (HTTP Basic Auth) since this is a browsable
    # search UI, not just an API — see CONTEXT.md + .setup.
    networks:
      - edge

networks:
  edge:
    external: true
