name: nginx-proxy-manager-stack

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Sole public listener on this host. NPM terminates TLS itself now
      # (per-host Let's Encrypt certs via HTTP-01) — host nginx is retired.
      - "80:80"
      - "443:443"
      # Admin UI. Bootstrap over SSH tunnel, then optionally front it with
      # its own proxy host inside NPM itself and drop this binding.
      - "127.0.0.1:31881:81"
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/nginx-proxy-manager/data:/data
      - ${HOME}/storage/homelab/homelab-conf/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    environment:
      - TZ=UTC
    networks:
      - edge

networks:
  edge:
    external: true
