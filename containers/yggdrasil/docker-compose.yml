# Self-hosted deploy of yggdrasil-hq/yggdrasil-core, pulling prebuilt GHCR
# images (control-plane services only — customer projects the Orchestrator
# builds/runs live on a k3s cluster configured in-app, not in this compose
# project). See CONTEXT.md and .setup.
#
# NOTE: composed values (DATABASE_URL, S3_ACCESS_KEY, public URLs, etc.) are
# set as literal full values directly in yggdrasil.env, not built here with
# ${VAR} interpolation — docker-compose only substitutes ${VAR} in this file
# from a file literally named .env (or the real shell environment), never
# from an env_file: target like yggdrasil.env. See CONTEXT.md.

name: yggdrasil-stack

services:
  landing:
    image: ghcr.io/yggdrasil-hq/yggdrasil-landing:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
    networks:
      - yggdrasil_net
      - edge

  web:
    image: ghcr.io/yggdrasil-hq/yggdrasil-web:latest
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    environment:
      PORT: "3000"
      NEXT_PUBLIC_BASE_PATH: "https://api-yggdrasil.yggdrasil.cfd"
      API_INTERNAL_URL: http://api:3000
    depends_on:
      - api
    networks:
      - yggdrasil_net
      - edge

  docusaurus:
    image: ghcr.io/yggdrasil-hq/yggdrasil-docusaurus:latest
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    environment:
      PORT: "3000"
      DOCS_BASE_URL: /
    networks:
      - yggdrasil_net
      - edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/yggdrasil/postgres:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $) escapes compose's own ${VAR} parsing so this reaches the
      # container's shell literally, which then expands it from the real
      # POSTGRES_USER env var the postgres image sets from env_file above.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yggdrasil_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    volumes:
      - ${HOME}/storage/homelab/homelab-data/yggdrasil/minio:/data
    networks:
      - yggdrasil_net

  api:
    image: ghcr.io/yggdrasil-hq/yggdrasil-api:latest
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    environment:
      PORT: "3000"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      ORCHESTRATOR_URL: http://orchestrator:8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - yggdrasil_net
      - edge

  orchestrator:
    image: ghcr.io/yggdrasil-hq/yggdrasil-orchestrator:latest
    restart: unless-stopped
    env_file:
      - ./yggdrasil.env
    environment:
      PORT: "8080"
      API_INTERNAL_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - yggdrasil_net
      - edge

networks:
  yggdrasil_net:
    driver: bridge
  edge:
    external: true
