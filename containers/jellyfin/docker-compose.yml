name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      # LAN client autodiscovery broadcast (UDP) — not HTTP, nginx-proxy-manager
      # can't route it, so this stays a direct host publish.
      - 31759:7359/udp
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/jellyfin/config:/config
      - ${HOME}/storage/homelab/homelab-conf/jellyfin/cache:/cache
      - ${HOME}/storage/homelab/homelab-data/arr/media:/data/media
    restart: "unless-stopped"
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.smugiwara.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jellyfin_net
      - edge

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
      - PORT=5055 #optional
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/seerr/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - jellyfin_net
      - edge

networks:
  jellyfin_net:
    driver: bridge
  edge:
    external: true
