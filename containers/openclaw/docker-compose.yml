name: openclaw-stack
# openclaw-gateway runs as the image's built-in `node` user (uid 1000) —
# do not override `user:` here, it already matches the host user convention.

services:
  openclaw-gateway:
    container_name: openclaw_gateway
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    init: true
    env_file:
      - ./openclaw.env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      TZ: UTC
      # Pin container-side state/workspace/config paths so a host-shaped
      # value pasted into openclaw.env can't leak into runtime path
      # resolution inside the container (upstream issue #77436).
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/openclaw/state:/home/node/.openclaw
      - ${HOME}/storage/homelab/homelab-data/openclaw/workspace:/home/node/.openclaw/workspace
      - ${HOME}/storage/homelab/homelab-conf/openclaw/auth-secrets:/home/node/.config/openclaw
      ## Uncomment to let the gateway sandbox agent tool calls in per-task
      ## containers (agents.defaults.sandbox). This hands the gateway the
      ## host's docker socket — a much bigger blast radius than the default
      ## in-process tool execution, so it stays off unless deliberately enabled.
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"  # only needed if the docker.sock mount above is enabled
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      # Lets local-model providers (LM Studio/Ollama on the host) be reached
      # at http://host.docker.internal:<port> from inside the container.
      - "host.docker.internal:host-gateway"
    # No `ports:` — control UI, HTTP API, and websocket RPC are all
    # multiplexed on 18789. Like every other HTTP-facing stack here, this
    # only joins `edge` and nginx-proxy-manager reaches it at
    # openclaw_gateway:18789. See CONTEXT.md + .setup.
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
      ]
    healthcheck:
      # Upstream's own docker-compose.yml points this at
      # dist/docker-healthcheck.js, which doesn't exist in the published
      # ghcr.io/openclaw/openclaw:latest image (checked directly inside the
      # running container) — using fetch() against /healthz instead, since
      # it's the same endpoint the app itself reports live/ready on.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge

  # One-off CLI runner for onboarding and channel setup. Shares the
  # gateway's network namespace so it can reach it at localhost. Gated
  # behind a profile so up-all-stacks.sh's plain `docker compose up -d`
  # doesn't start it as a long-running service — invoke it explicitly:
  #   docker compose --profile cli run --rm openclaw-cli <args>
  openclaw-cli:
    profiles: ["cli"]
    image: ghcr.io/openclaw/openclaw:latest
    network_mode: "service:openclaw-gateway"
    env_file:
      - ./openclaw.env
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      TZ: UTC
      BROWSER: echo
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    volumes:
      - ${HOME}/storage/homelab/homelab-conf/openclaw/state:/home/node/.openclaw
      - ${HOME}/storage/homelab/homelab-data/openclaw/workspace:/home/node/.openclaw/workspace
      - ${HOME}/storage/homelab/homelab-conf/openclaw/auth-secrets:/home/node/.config/openclaw
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

networks:
  edge:
    external: true
