namespace: homelab-openclaw

server:
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "latest@sha256:d0ded1dd76939b2bf4d67ef2d13247b8b160aa5666331d4a0b0e58811182cbb8"
  port: 18789
  args: ["dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  env:
    HOME: /home/node
    OPENCLAW_HOME: /home/node
    TERM: xterm-256color
    TZ: UTC
    OPENCLAW_STATE_DIR: /home/node/.openclaw
    OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
    OPENCLAW_CONFIG_DIR: /home/node/.openclaw
    OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    SEARXNG_BASE_URL: http://searxng-server.homelab-searxng.svc.cluster.local:8080
  envSecretName: openclaw-secrets
  persistence:
    - name: state
      mountPath: /home/node/.openclaw
      size: 2Gi
      storageClassName: local-path
    - name: workspace
      mountPath: /home/node/.openclaw/workspace
      size: 5Gi
      storageClassName: local-path
    - name: auth-secrets
      mountPath: /home/node/.config/openclaw
      size: 512Mi
      storageClassName: local-path

# CLAUDE.md flags this stack's gateway token as granting agent control, yet it
# was the one public AI endpoint with no ingress-level gate at all (ollama and
# hermes both have one). Rate limiting is the interim mitigation; target state
# is netbird-only. See docs/adr/0005-backup-restore.md.
rateLimit:
  average: 200
  burst: 400

ingress:
  enabled: true
  host: openclaw.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-openclaw-ratelimit@kubernetescrd
