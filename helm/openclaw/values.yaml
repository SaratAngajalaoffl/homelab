namespace: homelab-openclaw

server:
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "latest@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250"
  port: 18789
  args: ["dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  env:
    HOME: /home/node
    OPENCLAW_HOME: /home/node
    TERM: xterm-256color
    TZ: UTC
    OPENCLAW_STATE_DIR: /home/node/.openclaw
    OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
    OPENCLAW_CONFIG_DIR: /home/node/.openclaw
    OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
    SEARXNG_BASE_URL: http://searxng-server.homelab-searxng.svc.cluster.local:8080
  envSecretName: openclaw-secrets
  persistence:
    - name: state
      mountPath: /home/node/.openclaw
      size: 2Gi
      storageClassName: local-path
    - name: workspace
      mountPath: /home/node/.openclaw/workspace
      size: 5Gi
      storageClassName: local-path
    - name: auth-secrets
      mountPath: /home/node/.config/openclaw
      size: 512Mi
      storageClassName: local-path

ingress:
  enabled: true
  host: openclaw.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
