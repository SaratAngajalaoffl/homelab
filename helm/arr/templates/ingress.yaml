{{- $fullname := include "homelab-common.fullname" (dict "root" $ "name" "arr") -}}
{{- range $key, $ing := .Values.ingress }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-%s" $fullname $key }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "name" "arr") | nindent 4 }}
  annotations:
    {{- if $ing.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.clusterIssuer }}
    {{- end }}
    {{/*
    Applied to every route in this stack, not per-ingress: all five are
    publicly reachable with app-level auth only, and qBittorrent's "run
    external program on completion" makes its WebUI an RCE primitive by
    design. Interim mitigation only — target state is netbird-only, see
    docs/adr/0005-backup-restore.md.
    */}}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-ratelimit@kubernetescrd" $.Values.namespace }}
spec:
  ingressClassName: {{ $ing.className | default "traefik" }}
  tls:
    - hosts:
        - {{ $ing.host }}
      secretName: {{ printf "%s-%s-tls" $fullname $key }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  number: {{ index $.Values.pod $key "port" }}
{{- end }}
{{- end }}
