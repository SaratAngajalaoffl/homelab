namespace: homelab-arr

# All apps below run as containers inside ONE pod (see templates/arr-pod.yaml),
# matching Compose's `network_mode: "service:gluetun"` sidecar trick — a k8s
# pod's containers already share one network namespace natively, so every
# app reaches the internet through gluetun's VPN tunnel just by being a
# container in this pod, with no explicit network_mode needed.
pod:
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:89e3cbe22e0d6f09a18d3e86269392fd9f7f08e8991040741e577f8f127cdfe4
    env:
      # Kernel wireguard needs net.ipv4.conf.all.src_valid_mark=1, which is
      # not on this cluster's allowed pod-sysctl list (SysctlForbidden) and
      # can only be set node-wide via kubelet flags. Userspace wireguard
      # avoids that requirement entirely, at a small throughput cost.
      WIREGUARD_IMPLEMENTATION: "userspace"
      # Auto MTU discovery picked 1400, too high once flannel's VXLAN
      # overlay overhead is added on top of wireguard's own encapsulation
      # ("message too long" on send) — pin it lower.
      WIREGUARD_MTU: "1320"
      # Manual exec tests (nc/ping/dig) all succeeded through the tunnel —
      # the actual connection works. Gluetun's own healthcheck was just
      # racing ahead of the freshly-established tunnel/DNS warm-up and
      # restarting it in a loop before it ever had a chance to prove itself.
      # Give it more startup grace and skip its own DNS resolution for the
      # health target.
      HEALTH_VPN_DURATION_INITIAL: "30s"
      HEALTH_TARGET_ADDRESS: "1.1.1.1:443"
    envSecretName: arr-secrets
    persistence:
      name: gluetun-config
      mountPath: /gluetun
      size: 1Gi
      storageClassName: local-path

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    port: 8080
    persistence:
      name: qbittorrent-config
      mountPath: /config
      size: 2Gi
      storageClassName: local-path

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    env:
      LOG_LEVEL: "info"
      LOG_HTML: "false"
      CAPTCHA_SOLVER: "none"
      TZ: "Europe/London"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 8989
    persistence:
      name: sonarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 7878
    persistence:
      name: radarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 9696
    persistence:
      name: prowlarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest@sha256:f23ad77a681b8a2d90a024a26699829176ff5c60bd54ecbc62d203ad4a2f175e
    env:
      TZ: "Asia/Kolkata"
      PUID: "1000"
      PGID: "1000"
    envSecretName: arr-secrets
    port: 7575
    persistence:
      configName: homarr-config
      configMountPath: /config
      appdataName: homarr-appdata
      appdataMountPath: /appdata
      size: 2Gi
      storageClassName: local-path

# Live-shared arr data tree (torrents + media + usenet), shared read/write
# across qbittorrent/sonarr/radarr/prowlarr via the `data` volume below.
# Previously a hostPath mount at ~/storage/homelab/homelab-data/arr; that tree
# was deleted (operator no longer needs the library) so this is now a regular
# PVC on local-path, per ADR 0005's storage-reality note that PVCs land under
# /var/lib/rancher/k3s/storage, not the data disk. Unlike jellyfin's `media`
# hostPath (which stays hostPath since it points at real external media), this
# one no longer needs single-node-only hostPath semantics.
data:
  persistence:
    name: arr-data
    size: 50Gi
    storageClassName: local-path

# Applied to all five ingresses below by templates/ingress.yaml.
rateLimit:
  average: 20
  burst: 40

ingress:
  sonarr:
    enabled: true
    host: sonarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  radarr:
    enabled: true
    host: radarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  prowlarr:
    enabled: true
    host: prowlarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  homarr:
    enabled: true
    host: homarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  qbittorrent:
    enabled: true
    host: qbittorrent.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
