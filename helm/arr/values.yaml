namespace: homelab-arr

# All apps below run as containers inside ONE pod (see templates/arr-pod.yaml),
# matching Compose's `network_mode: "service:gluetun"` sidecar trick — a k8s
# pod's containers already share one network namespace natively, so every
# app reaches the internet through gluetun's VPN tunnel just by being a
# container in this pod, with no explicit network_mode needed.
pod:
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:c2ee4191762fca6b6a3c3359a731198a95d9c9af4db32d466e223bf3a84e779b
    env:
      # Kernel wireguard needs net.ipv4.conf.all.src_valid_mark=1, which is
      # not on this cluster's allowed pod-sysctl list (SysctlForbidden) and
      # can only be set node-wide via kubelet flags. Userspace wireguard
      # avoids that requirement entirely, at a small throughput cost.
      WIREGUARD_IMPLEMENTATION: "userspace"
      # Auto MTU discovery picked 1400, too high once flannel's VXLAN
      # overlay overhead is added on top of wireguard's own encapsulation
      # ("message too long" on send) — pin it lower.
      WIREGUARD_MTU: "1320"
      # Manual exec tests (nc/ping/dig) all succeeded through the tunnel —
      # the actual connection works. Gluetun's own healthcheck was just
      # racing ahead of the freshly-established tunnel/DNS warm-up and
      # restarting it in a loop before it ever had a chance to prove itself.
      # Give it more startup grace and skip its own DNS resolution for the
      # health target.
      HEALTH_VPN_DURATION_INITIAL: "30s"
      HEALTH_TARGET_ADDRESS: "1.1.1.1:443"
    envSecretName: arr-secrets
    persistence:
      name: gluetun-config
      mountPath: /gluetun
      size: 1Gi
      storageClassName: local-path

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    port: 8080
    persistence:
      name: qbittorrent-config
      mountPath: /config
      size: 2Gi
      storageClassName: local-path

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    env:
      LOG_LEVEL: "info"
      LOG_HTML: "false"
      CAPTCHA_SOLVER: "none"
      TZ: "Europe/London"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:889dcc58c6aea859033985894b519b2e6b1e55d92527ed123f9f52e42ae7c97b
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 8989
    persistence:
      name: sonarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 7878
    persistence:
      name: radarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Kolkata"
    port: 9696
    persistence:
      name: prowlarr-config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest@sha256:f8d5a9db38320c013c9ce2ad0c19a8a171cd55f772884ea7860e5f3ccc012c2c
    env:
      TZ: "Asia/Kolkata"
      PUID: "1000"
      PGID: "1000"
    envSecretName: arr-secrets
    port: 7575
    persistence:
      configName: homarr-config
      configMountPath: /config
      appdataName: homarr-appdata
      appdataMountPath: /appdata
      size: 2Gi
      storageClassName: local-path

# Live-shared arr data tree (torrents + media + usenet), shared read/write
# across qbittorrent/sonarr/radarr/prowlarr via the `data` volume below, and
# read-only by jellyfin below via its `media` subPath mount of this same PVC.
# Previously a hostPath mount at ~/storage/homelab/homelab-data/arr; that tree
# was deleted (operator no longer needs the library) so this is now a regular
# PVC on local-path, per ADR 0005's storage-reality note that PVCs land under
# /var/lib/rancher/k3s/storage, not the data disk.
data:
  persistence:
    name: arr-data
    size: 50Gi
    storageClassName: local-path

# jellyfin and seerr were previously their own helm/jellyfin chart in a
# separate homelab-jellyfin namespace. Folded in here because they're part of
# the same media pipeline as the rest of this stack (jellyfin serves what arr
# downloads, seerr files requests against it) — and being in the same
# namespace lets jellyfin mount the `data` PVC above directly by name/subPath
# instead of reaching across namespaces via a raw hostPath to its local-path
# backing directory.
jellyfin:
  image:
    repository: jellyfin/jellyfin
    tag: "latest@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5"
  port: 8096
  env:
    JELLYFIN_PublishedServerUrl: https://jellyfin.smugiwara.com
  persistence:
    - name: config
      mountPath: /config
      size: 5Gi
      storageClassName: local-path
    - name: cache
      mountPath: /cache
      size: 2Gi
      storageClassName: local-path
  # Read-only mount of the `data` PVC's media subdir — same PVC arr's
  # containers write new downloads into, via a real PVC reference now that
  # jellyfin lives in this namespace/chart (no more hostPath workaround).
  extraVolumes:
    - name: media
      persistentVolumeClaim:
        claimName: arr-arr-data
        readOnly: true
  extraVolumeMounts:
    - name: media
      mountPath: /data/media
      subPath: media
      readOnly: true

seerr:
  image:
    repository: ghcr.io/seerr-team/seerr
    tag: "latest@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be"
  port: 5055
  env:
    LOG_LEVEL: debug
    TZ: Asia/Kolkata
    PORT: "5055"
  persistence:
    - name: config
      mountPath: /app/config
      size: 1Gi
      storageClassName: local-path

jellyfinIngress:
  enabled: true
  host: jellyfin.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod

seerrIngress:
  enabled: true
  host: seerr.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod

# Applied to all five ingresses below by templates/ingress.yaml.
rateLimit:
  average: 200
  burst: 400

ingress:
  sonarr:
    enabled: true
    host: sonarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  radarr:
    enabled: true
    host: radarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  prowlarr:
    enabled: true
    host: prowlarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  homarr:
    enabled: true
    host: homarr.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
  qbittorrent:
    enabled: true
    host: qbittorrent.smugiwara.com
    className: traefik
    clusterIssuer: letsencrypt-prod
