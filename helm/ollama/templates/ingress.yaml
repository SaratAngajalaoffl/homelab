{{/*
Ollama has no auth of its own, so the public endpoint needs a bearer-token
gate. That gate used to live in the IngressRoute's own matcher:

  match: Host(`...`) && HeaderRegexp(`Authorization`, `^Bearer {{ .Values.apiKey }}$`)

with apiKey coming from a gitignored values.secret.yaml. Under ArgoCD that
rendered as `^Bearer $` and matched nothing — the repo-server renders from
git and never sees the gitignored file — so the endpoint was dead and the
auth control was not actually running. See helm/token-auth/values.yaml.

Now a plain Ingress plus a ForwardAuth middleware, which also means
cert-manager's normal cluster-issuer annotation works and the standalone
Certificate object this template used to need is gone.
*/}}
{{- $ing := .Values.ingress -}}
{{- if $ing.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "name" "server") | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.forwardAuth.address | quote }}
---
{{ include "homelab-common.ingress" (dict "root" $ "name" "server" "ingress" $ing "port" .Values.server.port) }}
{{- end }}
