namespace: homelab-ollama

server:
  image:
    repository: ollama/ollama
    tag: "latest@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429"
  port: 11434
  env:
    OLLAMA_HOST: "0.0.0.0:11434"
    # Same override as Compose — qwen3.6:35b's own reasoning burns thousands
    # of tokens before the final answer; Ollama's VRAM-based auto-sizing
    # picks 4096 by default for this model, which truncates before any
    # content comes out. See helm/ollama/.setup if one is added.
    OLLAMA_CONTEXT_LENGTH: "32768"
  # Requires the "nvidia" RuntimeClass + nvidia-device-plugin DaemonSet
  # installed on the cluster first (host-level containerd config change,
  # done by the user — see .setup-equivalent instructions given out of repo).
  runtimeClassName: nvidia
  # Single GPU on a single node: RollingUpdate's surge pod can never schedule
  # while the old pod still holds the only nvidia.com/gpu unit.
  strategy:
    type: Recreate
  resources:
    limits:
      nvidia.com/gpu: 1
  persistence:
    - name: data
      mountPath: /root/.ollama
      size: 50Gi
      storageClassName: local-path

# The bearer token itself lives in the token-auth stack's Secret, not here and
# not in a values.secret.yaml — see helm/token-auth/values.yaml for why the
# previous in-routing-rule approach could never work under ArgoCD.
# ForwardAuth's address is an ordinary in-cluster URL, so it may cross
# namespaces freely; the Middleware object referencing it may not, which is why
# templates/ingress.yaml creates one in this namespace.
forwardAuth:
  address: http://token-auth-server.homelab-token-auth.svc.cluster.local:8080/verify

ingress:
  enabled: true
  host: infer.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-ollama-forwardauth@kubernetescrd
