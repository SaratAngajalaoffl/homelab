namespace: homelab-hermes

server:
  image:
    repository: nousresearch/hermes-agent
    tag: "latest@sha256:7a69201726bc64db2072a1371557137c23312d29705cda2b8ea2a0214a50a4cf"
  args: ["gateway", "run"]
  env:
    HERMES_DASHBOARD: "1"
    SEARXNG_BASE_URL: http://searxng-server.homelab-searxng.svc.cluster.local:8080
    # Missing from the real hermes.env (only found API_SERVER_KEY and the
    # dashboard basic-auth vars there) — the app defaults its API server to
    # loopback-only without these, which meant hermes.smugiwara.com's proxy
    # target was unreachable cross-container even under the old Compose
    # setup, not just here. See helm/hermes/.setup if one is added.
    API_SERVER_ENABLED: "true"
    API_SERVER_HOST: "0.0.0.0"
  envSecretName: hermes-secrets
  persistence:
    - name: state
      mountPath: /opt/data
      size: 5Gi
      storageClassName: local-path
  securityContext:
    fsGroup: 10000

apiPort: 8642
dashboardPort: 9119

# The bearer token lives in the token-auth stack's Secret — see
# helm/token-auth/values.yaml for why the previous in-routing-rule approach
# could never work under ArgoCD.
forwardAuth:
  address: http://token-auth-server.homelab-token-auth.svc.cluster.local:8080/verify

apiIngress:
  enabled: true
  host: hermes.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-hermes-forwardauth@kubernetescrd

# The dashboard is the Hermes web UI, which has its own login — it is not
# behind the bearer gate, which would break interactive browser use.
dashboardIngress:
  enabled: true
  host: hermes-dashboard.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
