{{/*
Bearer-token gated API route — same pattern as helm/ollama/templates/ingress.yaml.
The token used to be interpolated into the IngressRoute matcher from a
gitignored values.secret.yaml, which ArgoCD could never see; it rendered as
`^Bearer $` and matched nothing. Now a ForwardAuth middleware against the
token-auth stack, so the token lives in a Secret and clients are unchanged.
See helm/token-auth/values.yaml.
*/}}
{{- $ing := .Values.apiIngress -}}
{{- if $ing.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "name" "server") | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.forwardAuth.address | quote }}
---
{{ include "homelab-common.ingress" (dict "root" $ "name" "server" "ingress" $ing "port" .Values.apiPort) }}
{{- end }}
