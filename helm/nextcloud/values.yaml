namespace: homelab-nextcloud

server:
  image:
    repository: nextcloud
    tag: "latest@sha256:1969514cbcc9ae1e9a15ba2e388c7a0de5ee49ecd9c1da81e1e1a92d3dda46ca"
  port: 80
  # Official image runs as www-data (uid 33); fsGroup matches host bind-mount
  # ownership (also uid 33 / gid 33) so PVC data is group-writable the same way.
  securityContext:
    fsGroup: 33
  env:
    TZ: UTC
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 cloud.smugiwara.com"
    OVERWRITEPROTOCOL: https
    OVERWRITECLIURL: https://cloud.smugiwara.com
    OVERWRITEHOST: cloud.smugiwara.com
  envSecretName: nextcloud-secrets
  # Nextcloud here has no separate database container — it runs on SQLite,
  # whose file lives inside the `data` PVC. Kopia's fs-backup walks that PVC
  # live and non-atomically, so the SQLite file and the files it indexes can be
  # captured at different instants. Maintenance mode quiesces writes for the
  # duration of the walk, which is the supported way to get a consistent copy.
  #
  # Unlike the Postgres stacks there is no dump to retain, so a post hook IS
  # required — and its on-error is Fail so that a stuck maintenance mode
  # surfaces as a failed backup rather than a silently offline Nextcloud.
  podAnnotations:
    pre.hook.backup.velero.io/container: nextcloud-server
    pre.hook.backup.velero.io/command: '["su","-s","/bin/sh","www-data","-c","php /var/www/html/occ maintenance:mode --on"]'
    pre.hook.backup.velero.io/timeout: 5m
    pre.hook.backup.velero.io/on-error: Fail
    post.hook.backup.velero.io/container: nextcloud-server
    post.hook.backup.velero.io/command: '["su","-s","/bin/sh","www-data","-c","php /var/www/html/occ maintenance:mode --off"]'
    post.hook.backup.velero.io/timeout: 5m
    post.hook.backup.velero.io/on-error: Fail
  persistence:
    - name: app
      mountPath: /var/www/html
      size: 5Gi
      storageClassName: local-path
    - name: data
      mountPath: /var/www/html/data
      size: 10Gi
      storageClassName: local-path

ingress:
  enabled: true
  host: cloud.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  # No body-size annotation needed: unlike NPM's nginx (which needed
  # `client_max_body_size 0;`), Traefik has no default request body size
  # limit, so large Nextcloud uploads work with no extra config.
