# The single "app of apps" ArgoCD Application. Apply this once by hand
# (kubectl apply -f helm/argocd/root-app.yaml, plus project.yaml); from then
# on ArgoCD reconciles everything under helm/argocd/apps/ (the AppProject
# and one child Application per stack) from git — a `git push` is the
# deploy step for any change in that directory, per docs/adr/0004's
# "GitOps delivery (ArgoCD)" decision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:SaratAngajalaoffl/homelab.git
    targetRevision: main
    path: helm/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # backups.smugiwara.com pauses a child Application's auto-sync while a volume
  # restore is live (otherwise selfHeal reverts the repoint). Without this,
  # selfHeal on THIS app would put the child's auto-sync straight back. Re-apply
  # this file by hand after changing it (see the header).
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
