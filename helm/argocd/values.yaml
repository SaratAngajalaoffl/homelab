# Third-party infra, installed from its own upstream chart (not authored
# here), per docs/adr/0004-kubernetes-migration.md's "Workload packaging" /
# "GitOps delivery (ArgoCD)" decision — same pattern as cert-manager/
# sealed-secrets/headlamp.
#
# Install/upgrade:
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace -f helm/argocd/values.yaml
#
# Login: username `admin`, password is the auto-generated initial admin
# secret (`argocd-initial-admin-secret` in the argocd namespace) — read once
# via `kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d`,
# then rotate/delete per ArgoCD's own docs. Not sealed as a chart secret:
# it's generated in-cluster by ArgoCD itself on first install, not supplied
# by us, so there's nothing to seal ahead of time.

configs:
  params:
    # ArgoCD's server normally terminates its own TLS and expects either
    # passthrough or a dedicated ingress annotation at the edge. Since every
    # other Ingress in this cluster terminates TLS at Traefik via
    # cert-manager (same as headlamp/every migrated stack), run the server
    # in insecure (plain HTTP) mode behind the Ingress instead of wiring up
    # SSL passthrough — simpler and consistent with the rest of the cluster.
    server.insecure: true

# ArgoCD is publicly reachable and can deploy anything to any namespace, with
# only the single built-in `admin` account in front of it (no SSO/OIDC). Rate
# limiting blunts credential stuffing; it is not a substitute for taking this
# off the public internet, which is the agreed target state — see
# docs/adr/0005-backup-restore.md "Public exposure and the netbird migration
# plan". Delivered via the upstream chart's extraObjects because Middlewares
# are namespaced and k3s's Traefik has allowCrossNamespace off by default, so
# the object has to live in the argocd namespace itself.
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: ratelimit
      namespace: argocd
    spec:
      rateLimit:
        average: 20
        burst: 40
        period: 1m

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.smugiwara.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: argocd-ratelimit@kubernetescrd
    tls: true
