# headlamp is a values-only chart (no local Chart.yaml, see helm/headlamp/values.yaml)
# installed straight from its upstream chart repo — needs a multi-source
# Application: one source pulls the upstream chart, the other supplies our
# values.yaml from git via the `$values` ref.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.45.0
      helm:
        valueFiles:
          - $values/helm/headlamp/values.yaml
    - repoURL: git@github.com:SaratAngajalaoffl/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
