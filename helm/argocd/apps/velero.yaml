# velero is a values-only chart (no local Chart.yaml, see helm/velero/values.yaml)
# installed straight from its upstream chart repo — needs a multi-source
# Application: one source pulls the upstream chart, the other supplies our
# values.yaml from git via the `$values` ref. Same pattern as headlamp.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 8.1.0
      helm:
        valueFiles:
          - $values/helm/velero/values.yaml
    - repoURL: git@github.com:SaratAngajalaoffl/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
