apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: git@github.com:SaratAngajalaoffl/homelab.git
    targetRevision: main
    path: helm/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: homelab-hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
