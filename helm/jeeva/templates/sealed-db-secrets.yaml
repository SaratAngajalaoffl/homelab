{{- if ne .Values.namespace "homelab-jeeva-public" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jeeva-db-secrets
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: jeeva-db-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
{{- end }}
