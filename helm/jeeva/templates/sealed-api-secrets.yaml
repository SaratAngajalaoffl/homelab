{{- if ne .Values.namespace "homelab-jeeva-public" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jeeva-api-secrets
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    AUTH_PASSWORD: 
    AUTH_USERNAME: 
    DATABASE_URL: 
    JWT_SECRET: 
  template:
    metadata:
      name: jeeva-api-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
{{- end }}
