# Overlay for the "jeeva-public" instance — paper-trading-only, at
# jeeva.trade. Deployed from the same chart as the base values.yaml
# ("jeeva-internal") via ArgoCD Application "jeeva-public"
# (helm/argocd/apps/jeeva-public.yaml), which layers this file on top of
# values.yaml. Everything not overridden here (image tags, persistence
# sizes, backup hook commands, etc.) is inherited from values.yaml.
#
# This is a brand-new instance with its own namespace, own databases, and
# its own secrets — see CONTEXT.md "jeeva-public bootstrap" for the sealed
# secrets that must be created (resealed against this namespace) before
# ArgoCD can bring it up.
namespace: homelab-jeeva-public

api:
  env:
    # homelab-common's fullname helper prefixes non-release-name resources
    # with the release name, so the mongo Service here is
    # "jeeva-public-mongo", not "jeeva-mongo" (values.yaml's default, correct
    # only for the "jeeva" release).
    MONGO_URL: "mongodb://jeeva-public-mongo:27017/jeeva"
    CORS_ORIGIN: "https://jeeva.trade"
    PAPER_TRADING_ONLY: "true"
    # Public instance floors how fast a visitor can configure market-data
    # sampling, to keep it from hammering Hyperliquid on this deployment's
    # behalf. api/src/perps/frequency.ts rejects any sampling config below
    # this.
    MIN_SAMPLING_FREQUENCY_SECONDS: "60"

engine:
  env:
    MONGO_URL: "mongodb://jeeva-public-mongo:27017/jeeva"
    PAPER_TRADING_ONLY: "true"
    # Explicit even though it matches the engine's own default (7) —
    # engine/src/market_data/retention.rs prunes sampled data older than
    # this many days.
    MARKET_DATA_TTL_DAYS: "7"

mongo:
  image:
    repository: mongo
    # values.yaml pins mongo back to 7 for jeeva-internal (its existing data
    # predates the 7->8 major bump and can't skip the FCV upgrade step — see
    # that file's comment). jeeva-public has no such legacy data (created
    # fresh today), so it stays on 8 rather than inheriting the pin down.
    tag: "8@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b"
  # Same claimName hardcoding issue as timescaledb below, but for
  # jeeva-mongo-dumps.
  extraVolumes:
    - name: dumps
      persistentVolumeClaim:
        claimName: jeeva-public-mongo-dumps

timescaledb:
  # values.yaml hardcodes this claimName to "jeeva-timescaledb-dumps", which
  # only matches the PVC homelab-common.pvcs generates for the "jeeva"
  # release name. For "jeeva-public" that PVC is
  # "jeeva-public-timescaledb-dumps" — override here so the dumps volume
  # actually resolves for this release.
  extraVolumes:
    - name: dumps
      persistentVolumeClaim:
        claimName: jeeva-public-timescaledb-dumps

frontend:
  env:
    # API_URL is read at container start and served to the browser via
    # /runtime-config — see values.yaml's frontend.env comment.
    API_URL: "https://api.jeeva.trade"

frontendIngress:
  host: jeeva.trade

apiIngress:
  host: api.jeeva.trade
