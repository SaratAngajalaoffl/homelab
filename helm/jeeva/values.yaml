# jeeva — AI-assisted Hyperliquid trading app. Source: github.com/SaratAngajalaoffl/jeeva
# (private repo, images published to GHCR on push to main).
#
# Both prior blockers are resolved — see CONTEXT.md:
#  1. GHCR imagePullSecret (ghcr-jeeva) exists in homelab-jeeva.
#  2. api/deploy/Dockerfile now ships api/migrations/, and
#     templates/db-migrate-job.yaml runs node-pg-migrate against
#     jeeva-api-secrets' DATABASE_URL as a pre-install/pre-upgrade hook.
#
# This is the base values file for the "jeeva-internal" instance (live
# trading, jeeva.smugiwara.com, ArgoCD Application "jeeva", untouched/
# pre-existing — do not rename or reseal its secrets). A second instance,
# "jeeva-public" (paper-trading-only, jeeva.trade), is deployed from this
# same chart via ArgoCD Application "jeeva-public" layering
# values-public.yaml on top of this file — see that file and CONTEXT.md.
namespace: homelab-jeeva

mongo:
  image:
    repository: mongo
    # On mongo 8 as of 2026-09-21, deliberately. Two prior Renovate 7->8
    # major bumps (PR #90, reverted in 16de7c1; PR #91) broke jeeva-internal
    # because mongo 8 refuses to start against the existing
    # featureCompatibilityVersion 7.0 data ("Wrong mongod version", exit
    # code 62) — mongo doesn't support skipping the FCV-bump step on a live
    # major upgrade. Rather than run that upgrade procedure against trading
    # data, this migration wiped jeeva-mongo-0's PVC (data-jeeva-mongo-0)
    # and re-initiated a fresh mongo 8 replica set — see
    # templates/mongo-rs-init-job.yaml's header comment for the other fix
    # that landed alongside this (the replset self-identity/hairpin issue).
    # App-level auth (AUTH_USERNAME/PASSWORD/JWT_SECRET in jeeva-api-secrets)
    # is untouched — mongo itself never ran with --auth, so there was
    # nothing in Mongo to preserve besides the trading data, which was
    # explicitly OK to drop for this migration.
    tag: "8@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b"
  port: 27017
  # Single-node replica set — required for the change streams the engine
  # uses to react to config updates (same as docker-compose.yml's mongo
  # service). Initiated idempotently by the post-install/post-upgrade hook
  # Job in templates/mongo-rs-init-job.yaml.
  args: ["--replSet", "rs0", "--bind_ip_all"]
  persistence:
    - name: data
      mountPath: /data/db
      size: 5Gi
      storageClassName: local-path
  podAnnotations:
    pre.hook.backup.velero.io/container: mongo
    pre.hook.backup.velero.io/command: '["/bin/sh","-c","set -e; mongodump --host 127.0.0.1 --db jeeva --archive=/dumps/mongo.dump.tmp && mv /dumps/mongo.dump.tmp /dumps/mongo.dump"]'
    pre.hook.backup.velero.io/timeout: 15m
    pre.hook.backup.velero.io/on-error: Fail
  dumpsPersistence:
    name: dumps
    size: 2Gi
    storageClassName: local-path
  extraVolumes:
    - name: dumps
      persistentVolumeClaim:
        claimName: jeeva-mongo-dumps
  extraVolumeMounts:
    - name: dumps
      mountPath: /dumps

timescaledb:
  image:
    repository: timescale/timescaledb
    tag: "latest-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9"
  port: 5432
  # Secret must provide POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
  envSecretName: jeeva-db-secrets
  persistence:
    - name: data
      # pg16-based image; PGDATA defaults to this path directly (unlike
      # postgres 18+, which needs the parent-dir mount trick — see
      # helm/yggdrasil/values.yaml's db.persistence comment).
      mountPath: /var/lib/postgresql/data
      size: 5Gi
      storageClassName: local-path
  podAnnotations:
    pre.hook.backup.velero.io/container: timescaledb
    pre.hook.backup.velero.io/command: '["/bin/sh","-c","set -e; export PGPASSWORD=$POSTGRES_PASSWORD; pg_dump -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB -Fc -f /dumps/db.dump.tmp && mv /dumps/db.dump.tmp /dumps/db.dump"]'
    pre.hook.backup.velero.io/timeout: 15m
    pre.hook.backup.velero.io/on-error: Fail
  dumpsPersistence:
    name: dumps
    size: 2Gi
    storageClassName: local-path
  extraVolumes:
    - name: dumps
      persistentVolumeClaim:
        claimName: jeeva-timescaledb-dumps
  extraVolumeMounts:
    - name: dumps
      mountPath: /dumps

api:
  image:
    repository: ghcr.io/saratangajalaoffl/jeeva/api
    # publish.yml (in the jeeva repo) only tags "main" on a push to main —
    # docker/metadata-action's default "latest=auto" flavor only fires for
    # semver-tag pushes, not branch pushes, so there is no ":latest" tag to
    # pull. Digest-pinned (docker pull/inspect against ghcr.io with the
    # ghcr-jeeva PAT) so ArgoCD/Renovate can detect new pushes to "main" via
    # digest bumps, same pattern as helm/yggdrasil/values.yaml. Re-pin
    # manually until Renovate's digest-tracking picks this stack up.
    tag: "main@sha256:d44c029d3e1c46a17cc86969b9a11058eeb5a11bace78dcea9c6e9344c646e0e"
  imagePullSecrets: ["ghcr-jeeva"]
  port: 4000
  env:
    PORT: "4000"
    MONGO_URL: "mongodb://jeeva-mongo:27017/jeeva?directConnection=true"
    CORS_ORIGIN: "https://jeeva.smugiwara.com"
    # This is "jeeva-internal" — live trading. The "jeeva-public" instance
    # (separate ArgoCD Application/namespace, see values-public.yaml) is the
    # paper-trading-only one at jeeva.trade.
    PAPER_TRADING_ONLY: "false"
    # Not secret — same as engine's OPENROUTER_BASE_URL. decisionMakers/status.js
    # (src/decisionMakers/status.js) runs in this api service and reads
    # OPENROUTER_API_KEY/TYPESAFE_API_KEY from *its own* process.env to report
    # the dashboard's "Decision makers" configured/reachable state — the engine
    # having these vars doesn't help api's copy, so this key is duplicated into
    # jeeva-api-secrets too (see templates/sealed-api-secrets.yaml).
    OPENROUTER_BASE_URL: "https://openrouter.ai/api/alpha"
    # Not set — internal instance keeps the api's default floor
    # (MIN_SAMPLING_FREQUENCY_SECONDS, defaults to 1s in
    # api/src/perps/frequency.ts). jeeva-public overrides this to 60s —
    # see values-public.yaml.
  # Secret must provide AUTH_USERNAME / AUTH_PASSWORD / JWT_SECRET /
  # DATABASE_URL (a full postgres:// URI pointed at jeeva-timescaledb, using
  # the same credentials as jeeva-db-secrets — k8s env var expansion can't
  # reach across envFrom sources, so it's a full URI here rather than
  # composed from POSTGRES_* pieces), and MAY provide OPENROUTER_API_KEY /
  # TYPESAFE_API_KEY / TYPESAFE_BASE_URL (mirrors of engine's, so the
  # dashboard's decision-maker status check — which runs in api, not engine —
  # can see them) — see templates/sealed-*.yaml.
  envSecretName: jeeva-api-secrets

engine:
  image:
    repository: ghcr.io/saratangajalaoffl/jeeva/engine
    tag: "main@sha256:98563ce1f5e64830ce5f8d2596eb22ec3cb1dbdf4379b5bc55ec30ac7bc86c9e"
  imagePullSecrets: ["ghcr-jeeva"]
  # No port — background worker only (decision/scheduler loop), same as
  # docker-compose.yml's engine service.
  env:
    MONGO_URL: "mongodb://jeeva-mongo:27017/jeeva?directConnection=true"
    # Not secret — overrides the engine's built-in default
    # (OPENROUTER_BASE_URL in src/decision/openrouter_jev_decision_maker.rs)
    # so a per-PERP "openrouter" decision maker resolves here.
    OPENROUTER_BASE_URL: "https://openrouter.ai/api/alpha"
    PAPER_TRADING_ONLY: "false"
    # Not set — internal instance keeps the engine's default retention
    # (MARKET_DATA_TTL_DAYS, defaults to 7 in engine/src/market_data/
    # retention.rs). jeeva-public overrides this explicitly to 7 too — see
    # values-public.yaml.
  # Secret must provide DATABASE_URL (same value as jeeva-api-secrets'), and
  # MAY provide OPENROUTER_API_KEY (required for the "openrouter"
  # DecisionMaker — see templates/sealed-engine-secrets.yaml; engine/src/
  # main.rs registers it only if that var is present, otherwise it's an
  # UnconfiguredDecisionMaker) / TYPESAFE_API_KEY / TYPESAFE_BASE_URL /
  # HYPERLIQUID_PRIVATE_KEY / HYPERLIQUID_TESTNET. Omit them and the engine
  # stays in Fake/mock mode, its default.
  envSecretName: jeeva-engine-secrets

frontend:
  image:
    repository: ghcr.io/saratangajalaoffl/jeeva/frontend
    tag: "main@sha256:e944d9d4e7521084526a7cfa9b5d57e9ee77e6c1f1a0533703b293e8d3930461"
  imagePullSecrets: ["ghcr-jeeva"]
  port: 3000
  # API_URL replaces the old build-time-baked NEXT_PUBLIC_API_URL — see
  # CONTEXT.md "Frontend API URL is baked at build time" (now resolved
  # upstream: the frontend reads API_URL at container start and serves it
  # to the browser via /runtime-config, so this is effective at runtime).
  env:
    API_URL: "https://jeeva-api.smugiwara.com"
    # Internal instance is live trading, not a demo — no demo-credentials
    # banner. jeeva-public overrides this to "true" (see values-public.yaml).
    DEMO_MODE: "false"

# Publicly reachable with only jeeva's own login (AUTH_USERNAME/PASSWORD) in
# front of it, same posture as atuin/webui/portainer — see
# docs/adr/0005-backup-restore.md "Public exposure and the netbird migration
# plan".
rateLimit:
  average: 20
  burst: 40

frontendIngress:
  enabled: true
  host: jeeva.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-jeeva-ratelimit@kubernetescrd

apiIngress:
  enabled: true
  host: jeeva-api.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-jeeva-ratelimit@kubernetescrd
