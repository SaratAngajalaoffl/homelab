# Third-party infra, installed from its own upstream chart (not authored
# here) — same pattern as headlamp/cert-manager/sealed-secrets, see
# helm/argocd/CONTEXT.md. Velero owns the CLOUD half of the backup story:
#   - cloud backup: automatic, the weekly Schedule below
#   - cloud restore: manual (`velero restore create`, see .setup)
#
# The LOCAL (external hard drive) half is NOT Velero — see helm/backup-local,
# a restic CronJob writing straight to the drive. Velero's object-store
# plugins only speak S3 and it has no filesystem BackupStorageLocation, so
# pointing it at a local disk previously required fronting the drive with a
# MinIO gateway (the retired helm/backup-minio stack). That was dropped:
# the drive is exFAT, which MinIO does not support as a backend (no POSIX
# ownership, permissions or hardlinks). restic stores content-addressed
# blobs in its own encrypted format, so it works on exFAT unchanged AND
# encrypts the drive copy at rest. See docs/adr/0005-backup-restore.md.
#
# Install/upgrade:
#   helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
#   helm upgrade --install velero vmware-tanzu/velero -n velero --create-namespace -f helm/velero/values.yaml
#
# PVCs are captured via node-agent (Kopia) file-system backup, not volume
# snapshots — local-path-provisioner has no CSI snapshot support on this
# single-node cluster.

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Disabled deliberately. This chart's CRD install/upgrade Job is the single
# reason Velero never installed at all on this cluster — no CRDs, no server, no
# node-agent, no Schedule, and `kubectl get backups.velero.io` returning "the
# server doesn't have a resource type". It failed three different ways:
#
#  1. It defaults to `docker.io/bitnami/kubectl` with a tag derived from the
#     cluster version ("1.36"). Bitnami retired their public Docker Hub
#     catalog, so that image 404s -> Init:ImagePullBackOff.
#  2. Pointed at registry.k8s.io/kubectl instead: pulls, but that image is
#     distroless. The job's init container runs
#         /bin/sh -c 'cp `which sh` /tmp && cp `which kubectl` /tmp'
#     to stage both binaries into a shared volume, and there is no /bin/sh
#     -> Init:RunContainerError.
#  3. Pointed at alpine/kubectl: init succeeds, then the main velero container
#     dies with `exec /tmp/sh: no such file or directory` — Alpine's busybox is
#     musl-linked and the velero image has no musl loader. The staged binaries
#     have to match velero's libc, not just be a working kubectl.
#
# Rather than keep hunting for a glibc image that still ships a shell (the
# archived bitnamilegacy/kubectl tops out at 1.33.4, three minors behind this
# cluster), drop the job: the chart ships its CRDs in crds/, which both Helm
# and ArgoCD apply directly. No third-party image in the critical path.
#
# TRADE-OFF: Helm never upgrades crds/ on a chart upgrade, and that job was
# what handled CRD schema changes. On a velero chart bump, check the release
# notes and apply CRD changes by hand:
#   kubectl apply -f https://github.com/vmware-tanzu/velero/releases/download/<ver>/velero-crds.yaml
upgradeCRDs: false

# Runs the Kopia-based node-agent DaemonSet that does the actual PVC
# file-system backup/restore work.
deployNodeAgent: true

# No volume snapshots on this cluster — local-path-provisioner has no CSI
# snapshot support, so PVCs are captured by fs-backup (see
# defaultVolumesToFsBackup below). Left at the chart default of true, it renders
# an unusable VolumeSnapshotLocation — `provider: null` and, because no
# namespace is threaded into that template, `namespace: default`, which is not
# even in the homelab AppProject's allowed destinations. It never applied, and
# held the whole Application at OutOfSync while the rest of velero ran fine.
snapshotsEnabled: false

# credentials.existingSecret only covers a single Secret; the BSL below
# points at its own Secret via configuration.backupStorageLocation[].credential
# instead, so this stays disabled.
credentials:
  useSecret: false

configuration:
  backupStorageLocation:
    - name: cloud
      provider: aws
      default: true
      bucket: loki-homelab-backup
      config:
        region: ap-south-1
      credential:
        name: velero-cloud-credentials
        key: cloud
  # No volumeSnapshotLocation — see comment above, fs-backup covers PVCs.
  defaultVolumesToFsBackup: true

schedules:
  cloud-weekly:
    disabled: false
    # Was "0 3 */7 * *", documented as "every 7 days" — it is not. Cron's
    # day-of-month */7 fires on days 1, 8, 15, 22 and 29, so the interval
    # resets at each month boundary (29th -> 1st is a 2-day gap) and drifts
    # relative to the week. "0 3 * * 0" is an actual weekly run, Sundays 03:00.
    schedule: "0 3 * * 0"
    template:
      storageLocation: cloud
      ttl: "720h0m0s"
      includedNamespaces:
        - "*"
