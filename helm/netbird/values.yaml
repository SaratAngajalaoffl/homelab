namespace: homelab-netbird

server:
  image:
    repository: netbirdio/netbird-server
    tag: "latest@sha256:7cf0268831221d2d4cc8ca89ca3d8d9419f890f0abb72c1fa9d00aae07e0b788"
  port: 80
  args: ["--config", "/etc/netbird/config.yaml"]
  # hostPort 3478 can't support a RollingUpdate surge on a single node: the
  # new pod can't schedule while the old pod still holds the port.
  strategy:
    type: Recreate
  persistence:
    - name: data
      mountPath: /var/lib/netbird
      size: 2Gi
      storageClassName: local-path
  # STUN is raw UDP; Traefik only proxies HTTP(S)/gRPC/websocket over TCP.
  # Single-node-only host port publish, same carve-out as Compose had.
  extraPorts:
    - containerPort: 3478
      protocol: UDP
      hostPort: 3478
  extraVolumes:
    - name: config
      secret:
        secretName: netbird-config
  extraVolumeMounts:
    - name: config
      mountPath: /etc/netbird/config.yaml
      subPath: config.yaml

dashboard:
  image:
    repository: netbirdio/dashboard
    tag: "latest@sha256:dbbec81fff42f6eb42ce0594033eafc1ae1c69b25a2595cc90e8097f0bcd468d"
  port: 80
  envSecretName: netbird-dashboard-env

ingress:
  enabled: true
  host: netbird.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
