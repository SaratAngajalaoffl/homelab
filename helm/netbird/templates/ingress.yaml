{{/*
Custom multi-path Ingress: netbird-server handles the gRPC/websocket/API/oauth2
paths, netbird-dashboard is the catch-all — replicates the NPM Advanced-tab
location blocks the retired nginx-proxy-manager used for this host.
NOTE: that NPM advanced-config file was deleted with the containers/ tree and
is not recoverable from this repo — treat the rules below as the source of truth.
Traefik proxies gRPC/websocket natively at the edge, but it still needs to
know to speak h2c (cleartext HTTP/2) to the netbird-server backend for the
gRPC paths below — otherwise it falls back to HTTP/1.1 upstream and gRPC
calls 404. That's set via the
traefik.ingress.kubernetes.io/service.serversscheme: h2c annotation on the
netbird-server Service (see server.yaml), not on this Ingress.
*/}}
{{- $ing := .Values.ingress -}}
{{- $serverName := include "homelab-common.fullname" (dict "root" $ "name" "netbird-server") -}}
{{- $dashName := include "homelab-common.fullname" (dict "root" $ "name" "netbird-dashboard") -}}
{{- if $ing.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serverName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "name" "netbird-server") | nindent 4 }}
  annotations:
    {{- if $ing.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ing.clusterIssuer }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className | default "traefik" }}
  tls:
    - hosts:
        - {{ $ing.host }}
      secretName: {{ printf "%s-tls" $serverName }}
  rules:
    - host: {{ $ing.host }}
      http:
        paths:
          - path: /relay
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /ws-proxy/
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /signalexchange.SignalExchange/
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /management.ManagementService/
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: {{ $serverName }}
                port:
                  number: {{ .Values.server.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $dashName }}
                port:
                  number: {{ .Values.dashboard.port }}
{{- end }}
