# Third-party infra, installed from its own upstream chart (not authored
# here), per docs/adr/0004-kubernetes-migration.md's "Workload packaging"
# decision — same pattern as cert-manager/sealed-secrets/nvidia-device-plugin.
#
# Install/upgrade:
#   helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/
#   helm upgrade --install headlamp headlamp/headlamp -n headlamp --create-namespace -f helm/headlamp/values.yaml
#
# Login: token-based (default, no OIDC configured). Generate a token for the
# cluster-admin-bound service account this chart creates:
#   kubectl create token headlamp -n headlamp --duration=24h
# Paste that token into Headlamp's login screen. Sessions expire per
# config.sessionTTL below and need a fresh token each time.

config:
  # Read-only cluster-admin view/edit access — this is a single-user homelab
  # dashboard, not multi-tenant, so no OIDC/per-user auth is configured.
  # Revisit (real auth, RBAC scoping) before ever sharing cluster access
  # with anyone else, e.g. yggdrasil's future users.
  sessionTTL: 86400

clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

# This chart binds its ServiceAccount to cluster-admin and is exposed publicly
# with token-only auth, so a stolen token is total cluster compromise. Rate
# limiting is an interim mitigation; the agreed target state is netbird-only
# access — see docs/adr/0005-backup-restore.md "Public exposure and the netbird
# migration plan". Shipped via extraManifests because Middlewares are
# namespaced and k3s's Traefik has allowCrossNamespace off by default.
# NOTE: this chart's values.schema.json types extraManifests as an array of
# STRINGS, not objects — passing a mapping fails with "at '/extraManifests/0':
# got object, want string" and ArgoCD reports the app Unknown/"Failed to load
# target state" while continuing to run the last good revision.
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: ratelimit
      namespace: headlamp
    spec:
      rateLimit:
        average: 20
        burst: 40
        period: 1m

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-ratelimit@kubernetescrd
  hosts:
    - host: headlamp.smugiwara.com
      paths:
        - path: /
          type: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.smugiwara.com
