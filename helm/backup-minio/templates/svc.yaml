{{/* homelab-common.service only wires a single port; MinIO needs the S3 API
port (9000, what Velero talks to) plus the console (9001), so this Service
is hand-written instead of using the shared helper. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-common.fullname" (dict "root" $ "name" "backup-minio") }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-common.labels" (dict "root" $ "name" "backup-minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "homelab-common.selectorLabels" (dict "root" $ "name" "backup-minio") | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.minio.port }}
      targetPort: {{ .Values.minio.port }}
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
