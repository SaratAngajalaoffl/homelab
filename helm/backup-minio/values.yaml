# MinIO gateway backing Velero's "local" BackupStorageLocation. Velero's
# object-store plugins only speak S3, so the external drive can't be a BSL
# on its own — MinIO here just re-exposes a hostPath directory as an S3
# bucket. Not for general use (no ingress, ClusterIP only) — Velero's
# node-agent is the only intended client.

namespace: homelab-backup-minio

minio:
  image:
    repository: minio/minio
    tag: "latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
  port: 9000
  args: ["server", "/data", "--console-address", ":9001"]
  # Secret must provide MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
  # Never committed — see .setup for how to create it out-of-band.
  envSecretName: backup-minio-secrets
  extraPorts:
    - containerPort: 9001
  # Direct hostPath, not a PVC: the drive is a specific external mount
  # (/run/media/mugiwara/munin), not something local-path-provisioner's
  # default root should own. Pins this pod to whichever node has the drive
  # mounted — fine on a single-node k3s cluster, revisit if a node is added.
  extraVolumes:
    - name: munin
      hostPath:
        path: /run/media/mugiwara/munin/velero-backups
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: munin
      mountPath: /data
