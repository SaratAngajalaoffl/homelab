namespace: homelab-portainer

server:
  image:
    repository: portainer/portainer-ce
    tag: "latest@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e"
  port: 9000
  persistence:
    - name: data
      mountPath: /data
      size: 1Gi
      storageClassName: local-path
  # Preserves visibility into containers running directly on this host
  # (outside k8s) — same trust model as the Compose bind mount, just
  # expressed as a hostPath volume. Requires this pod to stay scheduled on
  # the single node that owns /var/run/docker.sock (true by default here,
  # since k3s is single-node — revisit if a second node is ever added).
  extraVolumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
        type: Socket
  extraVolumeMounts:
    - name: docker-sock
      mountPath: /var/run/docker.sock

# Publicly reachable with only Portainer's own login in front of a container
# runtime socket — a credential-stuffing mitigation, not a fix. Target state is
# netbird-only; see docs/adr/0005-backup-restore.md.
rateLimit:
  average: 200
  burst: 400

ingress:
  enabled: true
  host: portainer.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-portainer-ratelimit@kubernetescrd
