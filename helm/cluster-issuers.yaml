# Cluster-wide cert-manager Issuers, applied once (not part of any stack chart).
# HTTP-01 challenge via the traefik IngressClass, matching NPM's existing
# HTTP-01-only approach (see containers/nginx-proxy-manager/CONTEXT.md's
# "Automatic SSL" note — no DNS-01 / DNS API credentials here either).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: chandrasarat74@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: chandrasarat74@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
