# Local (external hard drive) backup — the counterpart to helm/velero, which
# owns the cloud half. See docs/adr/0005-backup-restore.md for why these are
# two different tools rather than one.
#
# Short version: Velero has no filesystem BackupStorageLocation, so targeting
# a local disk meant fronting it with a MinIO S3 gateway (the retired
# helm/backup-minio stack). The munin drive is exFAT, which MinIO does not
# support as a backend — no POSIX ownership, permissions or hardlinks. restic
# stores content-addressed blobs in its own format, so exFAT is a non-issue,
# and it encrypts the repository at rest, which matters because these backups
# contain every Secret in the cluster (including the Sealed Secrets signing
# key) on a portable drive.

namespace: homelab-backup-local

image:
  repository: restic/restic
  tag: "0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510"

# Sundays 04:00 — an hour after velero's cloud-weekly (03:00), so the two
# never contend for disk. Deliberately automatic: the previous design made
# the local backup manual-only "on purpose", and the result was that it was
# never run once. Trigger an extra run by hand with:
#   kubectl -n homelab-backup-local create job --from=cronjob/backup-local manual-$(date +%Y%m%d)
schedule: "0 4 * * 0"

# Must provide RESTIC_PASSWORD. Never committed — see .setup.
envSecretName: backup-local-secrets

# Every PVC on this cluster is dynamically provisioned by local-path under
# this single root (verified: local-path-config nodePathMap ->
# /var/lib/rancher/k3s/storage), so one read-only mount captures all of them.
# NOTE: this is the OS disk (nvme1n1p2), not the ~/storage data disk — see
# CONTEXT.md's "local-path root" entry.
pvcRoot: /var/lib/rancher/k3s/storage

# The drive is a udisks automount. hostPath type: Directory makes the pod
# fail to schedule when the drive is absent, rather than DirectoryOrCreate
# silently materialising the path on the root filesystem and writing
# "backups" to the OS disk — the failure mode the retired backup-minio chart
# had. The mountpoint check in the job script is the second line of defence,
# for the case where the directory lingers after an unclean unplug.
driveHostPath: /run/media/mugiwara/munin
resticRepoSubpath: restic

# Keep the last two snapshots, nothing else. restic's --keep-last is a true
# count-based policy: `forget` runs only after a SUCCESSFUL backup, so a failed
# or skipped run can never expire what is already on the drive. That is the
# important difference from Velero's side of this (see the ttl note in
# helm/velero/values.yaml) — there, retention is time-based and expires on
# schedule whether or not new backups are still being produced.
#
# Was keepDaily 7 / keepWeekly 5 / keepMonthly 6, which on a weekly cadence
# retained roughly seven recent snapshots plus about six monthly ones.
retention:
  keepLast: 2

# Dead-man's-switch over the velero cloud backup — see templates/watchdog.yaml.
# Lives in this stack rather than helm/velero because velero is a values-only
# passthrough to an upstream chart with nowhere to put extra objects.
watchdog:
  enabled: true
  image:
    # Must have a shell as well as kubectl — the job body is a /bin/sh script.
    # registry.k8s.io/kubectl is distroless and fails with
    # `exec: "/bin/sh": stat /bin/sh: no such file or directory`, the same trap
    # that kept velero's CRD job from ever running. alpine/kubectl carries
    # busybox alongside kubectl. (musl is a non-issue here: unlike velero's job,
    # nothing copies binaries out into another container.)
    repository: alpine/kubectl
    tag: "1.37.0@sha256:f4ec5b2f9c92ba565a544e48fbcfe5353e3c6b96507f00dc898ccfb4b87889c5"
  # Daily 08:00: often enough to catch a missed weekly run promptly, rare
  # enough that a healthchecks.io grace period of ~36h is comfortable.
  schedule: "0 8 * * *"
  # Weekly backups, so anything past 8 days means a run was missed.
  maxAgeHours: 192
  # Must provide HEALTHCHECK_URL. Never committed — see .setup.
  envSecretName: backup-watchdog-secrets
