namespace: homelab-yggdrasil

landing:
  image:
    repository: ghcr.io/yggdrasil-hq/yggdrasil-landing
    tag: "latest@sha256:4482362c5d826e7df22f7935ae7278c3c18088f915596bc18738368bf466a16b"
  port: 3000
  env:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"

web:
  image:
    repository: ghcr.io/yggdrasil-hq/yggdrasil-web
    tag: "latest@sha256:8ef50b9256f19992389182f1f3999f7277b700fd64b63decc9cc144f6e42bf1a"
  port: 3000
  env:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_BASE_PATH: "https://api.yggdrasil.cfd"
    API_INTERNAL_URL: http://yggdrasil-api:3000
  envSecretName: yggdrasil-secrets

docusaurus:
  image:
    repository: ghcr.io/yggdrasil-hq/yggdrasil-docusaurus
    tag: "latest@sha256:0840a8e206d75a2e3659bb285404b02801af0394a394800d2837e572ba7a9b97"
  port: 3000
  env:
    PORT: "3000"
    DOCS_BASE_URL: /
  envSecretName: yggdrasil-secrets

db:
  image:
    repository: postgres
    tag: "18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"
  port: 5432
  envSecretName: yggdrasil-secrets
  persistence:
    - name: data
      # Mounts the PARENT, not .../data — this is the layout postgres 18+
      # requires, and matches helm/atuin. The 18 image stores its cluster in a
      # major-version-specific subdirectory (/var/lib/postgresql/18/docker) so
      # that `pg_upgrade --link` can work without crossing a mount boundary,
      # and its entrypoint hard-errors if it finds a legacy cluster sitting at
      # /var/lib/postgresql/data instead.
      #
      # This pod spent its whole life in CrashLoopBackOff for exactly that
      # reason: the postgres 16-alpine -> 18 bump (commit 1e5994c) landed on a
      # PG16 data directory and 18 refused to start on it. Fixing it was NOT
      # just this mountPath change — with the mount left at .../data and the
      # volume emptied, 18 starts happily but writes its cluster to
      # /var/lib/postgresql/18/docker on the CONTAINER filesystem, which is
      # ephemeral. That fails silently and loses everything on restart, which
      # is worse than crashlooping. The volume was dumped with pg_dumpall from
      # a temporary PG16 pod, wiped, and reloaded into a fresh 18 cluster.
      # See docs/adr/0005-backup-restore.md.
      mountPath: /var/lib/postgresql
      size: 5Gi
      storageClassName: local-path
  podAnnotations:
    pre.hook.backup.velero.io/container: db
    pre.hook.backup.velero.io/command: '["/bin/sh","-c","set -e; export PGPASSWORD=$POSTGRES_PASSWORD; pg_dump -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB -Fc -f /dumps/db.dump.tmp && mv /dumps/db.dump.tmp /dumps/db.dump"]'
    pre.hook.backup.velero.io/timeout: 15m
    pre.hook.backup.velero.io/on-error: Fail
  dumpsPersistence:
    name: dumps
    size: 2Gi
    storageClassName: local-path
  extraVolumes:
    - name: dumps
      persistentVolumeClaim:
        claimName: yggdrasil-db-dumps
  extraVolumeMounts:
    - name: dumps
      mountPath: /dumps

minio:
  image:
    repository: minio/minio
    tag: "latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e"
  port: 9000
  args: ["server", "/data", "--console-address", ":9001"]
  envSecretName: yggdrasil-secrets
  extraPorts:
    - containerPort: 9001
  persistence:
    - name: data
      mountPath: /data
      size: 10Gi
      storageClassName: local-path

api:
  image:
    repository: ghcr.io/yggdrasil-hq/yggdrasil-api
    tag: "latest@sha256:dbdfc4838504f428e5c2e2d01c88ee5424a5e7b8ef6a95b5cfbd3dce7ee4f619"
  port: 3000
  env:
    PORT: "3000"
    S3_ENDPOINT: http://yggdrasil-minio:9000
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: "true"
    ORCHESTRATOR_URL: http://yggdrasil-orchestrator:8080
  envSecretName: yggdrasil-secrets

orchestrator:
  image:
    repository: ghcr.io/yggdrasil-hq/yggdrasil-orchestrator
    tag: "latest@sha256:a1aa59261923690beaa4c1e03d91ed90d4836bb778d8da8bf961b1bc728734fc"
  port: 8080
  env:
    PORT: "8080"
    API_INTERNAL_URL: http://yggdrasil-api:3000
  envSecretName: yggdrasil-secrets

landingIngress:
  enabled: true
  host: yggdrasil.cfd
  className: traefik
  clusterIssuer: letsencrypt-prod

appIngress:
  enabled: true
  host: app.yggdrasil.cfd
  className: traefik
  clusterIssuer: letsencrypt-prod

apiIngress:
  enabled: true
  host: api.yggdrasil.cfd
  className: traefik
  clusterIssuer: letsencrypt-prod

docsIngress:
  enabled: true
  host: docs.yggdrasil.cfd
  className: traefik
  clusterIssuer: letsencrypt-prod
