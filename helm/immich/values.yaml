# Defaults safe to commit. DB_PASSWORD/POSTGRES_PASSWORD are NOT here —
# see templates/sealed-*.yaml (SealedSecret, encrypted, safe to commit).
# To rotate: re-seal with kubeseal against the controller's public key and
# commit the new SealedSecret; see helm/atuin for the reference pattern.

namespace: homelab-immich

server:
  image:
    repository: ghcr.io/immich-app/immich-server
    tag: "v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb"
  port: 2283
  env:
    DB_HOSTNAME: immich-immich-database
    DB_USERNAME: immich
    DB_DATABASE_NAME: immich
    REDIS_HOSTNAME: immich-immich-redis
    IMMICH_MACHINE_LEARNING_URL: http://immich-immich-ml:3003
  envSecretName: immich-server-secrets
  persistence:
    - name: data
      mountPath: /data
      size: 100Gi
      storageClassName: local-path

ml:
  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    tag: "v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e"
  port: 3003
  persistence:
    - name: cache
      mountPath: /cache
      size: 5Gi
      storageClassName: local-path

redis:
  image:
    repository: docker.io/valkey/valkey
    tag: "9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
  port: 6379

db:
  image:
    repository: ghcr.io/immich-app/postgres
    tag: "16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4"
  port: 5432
  env:
    POSTGRES_INITDB_ARGS: "--data-checksums"
  envSecretName: immich-db-secrets
  persistence:
    - name: data
      # Correct for postgres 16, which is what this image is. Do NOT bump the
      # major without also moving this mount to the parent
      # (/var/lib/postgresql) and migrating the data — postgres 18+ stores its
      # cluster in a major-version-specific subdirectory and its entrypoint
      # hard-errors on a legacy cluster found at .../data. That is exactly what
      # broke helm/yggdrasil; see the comment on its db.persistence and
      # docs/adr/0005-backup-restore.md. Renovate holds postgres majors for
      # manual review, so this lands as a reviewable PR — read this first.
      mountPath: /var/lib/postgresql/data
      size: 30Gi
      storageClassName: local-path
  # Velero's Kopia fs-backup walks a live filesystem with no snapshot or
  # freeze, so copying this data directory while Postgres is running yields a
  # torn backup — data files and WAL captured at different instants, which can
  # fail crash recovery on restore. This is the immich metadata DB: without it
  # the /data blobs restore as an unstructured pile with no albums, faces or
  # dates. So dump logically before Kopia walks. See helm/velero/CONTEXT.md.
  #
  # The dump is deliberately NOT removed by a post hook: helm/backup-local's
  # restic pass runs at 04:00, an hour after velero's 03:00, and picks up this
  # same fresh dump from the PVC. Deleting it would leave the local drive copy
  # with only the torn raw data directory.
  podAnnotations:
    pre.hook.backup.velero.io/container: immich-database
    pre.hook.backup.velero.io/command: '["/bin/sh","-c","set -e; export PGPASSWORD=$POSTGRES_PASSWORD; pg_dump -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB -Fc -f /dumps/db.dump.tmp && mv /dumps/db.dump.tmp /dumps/db.dump"]'
    pre.hook.backup.velero.io/timeout: 30m
    # Fail the backup loudly rather than shipping one whose DB is unrestorable.
    pre.hook.backup.velero.io/on-error: Fail
  # Standalone PVC, not a volumeClaimTemplate entry: StatefulSet
  # volumeClaimTemplates are immutable, so adding one to a live StatefulSet is
  # rejected by the API server. Pod template changes are allowed, so the dump
  # volume is wired in through extraVolumes instead.
  dumpsPersistence:
    name: dumps
    size: 10Gi
    storageClassName: local-path
  # Compose's `shm_size: 128mb` equivalent — Postgres needs more than k8s's
  # tiny default /dev/shm (64Mi total node-wide tmpfs) for larger queries.
  extraVolumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
    - name: dumps
      persistentVolumeClaim:
        claimName: immich-immich-database-dumps
  extraVolumeMounts:
    - name: dshm
      mountPath: /dev/shm
    - name: dumps
      mountPath: /dumps

ingress:
  enabled: true
  host: immich.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  # NPM's `client_max_body_size 0;` (nginx-specific, removes its 1MB default cap)
  # has no Traefik equivalent needed — Traefik imposes no default body-size limit.
