namespace: homelab-bifrost

server:
  image:
    repository: maximhq/bifrost
    tag: "latest@sha256:fe323e244998e1a40b87be87f60d023746eae40dd69baae8f7f42728a5e16149"
  port: 8080
  env:
    APP_PORT: "8080"
    APP_HOST: "0.0.0.0"
  # BIFROST_SETUP_TOKEN, used once from the dashboard (Workspace > Config >
  # Security) to create the first admin account and turn on password
  # protection. Provisioned directly in-cluster as `bifrost-secrets`
  # (kubectl, not committed) rather than a SealedSecret, same as
  # token-auth's envSecretName pattern — see helm/token-auth/values.yaml.
  envSecretName: bifrost-secrets
  persistence:
    # Provider configs, virtual keys, and logs are managed through Bifrost's
    # own web UI and written here — there is no per-provider env var/secret
    # to seal, unlike ollama/hermes.
    - name: data
      mountPath: /app/data
      size: 5Gi
      storageClassName: local-path

# Bifrost has no auth of its own in front of its config UI/API until the
# BIFROST_SETUP_TOKEN flow above is completed, and that UI can mint/hold
# every configured provider's API key — same public-exposure risk class as
# portainer/openclaw. Rate limiting is the interim mitigation; target state
# is netbird-only. See docs/adr/0005-backup-restore.md.
rateLimit:
  average: 200
  burst: 400

ingress:
  enabled: true
  host: bifrost.smugiwara.com
  className: traefik
  clusterIssuer: letsencrypt-prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: homelab-bifrost-ratelimit@kubernetescrd
